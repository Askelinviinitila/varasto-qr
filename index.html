<style>

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.install{display:none;margin:0 0 10px}.install.show{display:block}.row{display:flex;gap:10px}.row>*{flex:1}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 11px}label{font-size:13px;font-weight:700;color:#374151}
.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin:10px 0}.error{background:#fee2e2;color:#991b1b}.product{display:flex;justify-content:space-between;gap:10px;align-items:center}.product small{color:#6b7280}.qty{font-size:20px;font-weight:800;text-align:right}.low{color:#b45309}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:end;z-index:20}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px #0000000d}.tabs button{flex:1;background:#fff;border-radius:0;font-size:12px;padding:13px 5px}.empty{text-align:center;color:#6b7280;padding:25px}
#reader{width:100%;border-radius:14px;overflow:hidden}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-size:12px}.tree{margin:10px 0}.tree-parent{font-size:18px;font-weight:800}.tree-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.tree-head button{min-height:40px;padding:9px 12px;font-size:14px}.tree-child{margin:8px 0 8px 16px;border-left:3px solid #e5e7eb;padding-left:12px}.unit{font-size:13px;color:#6b7280}.indent{padding-left:18px}.sub-actions{display:flex;gap:8px;margin-top:8px}.sub-actions button{flex:1;min-height:42px;padding:10px 12px;font-size:14px}

.history-toolbar{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}.history-toolbar .row{align-items:end}.history-toolbar button{min-height:46px}.history-group{border:1px solid #e5e7eb;border-radius:16px;margin:12px 0;overflow:hidden;background:#fff}.history-group-head{padding:14px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb}.history-group-head h4{margin:0 0 4px;font-size:17px}.history-group-head small{color:#6b7280}.balance-table,.event-table{width:100%;border-collapse:collapse;font-size:14px}.balance-table th,.balance-table td,.event-table th,.event-table td{padding:9px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.balance-table th,.event-table th{font-size:12px;color:#6b7280;background:#fafafa}.balance-table td:last-child,.balance-table th:last-child,.event-table td:last-child,.event-table th:last-child{text-align:right}.balance-low{color:#b45309;font-weight:800}.event-plus{color:#166534;font-weight:800}.event-minus{color:#991b1b;font-weight:800}.history-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}.history-summary .card{margin:0;padding:12px} .history-summary b{font-size:19px;display:block}.print-only{display:none}.history-folders{display:grid;gap:10px}.history-folder{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px #00000008}.history-folder:hover{background:#fafafa}.folder-icon{font-size:28px}.folder-main{display:flex;flex-direction:column;gap:3px;flex:1}.folder-main strong{font-size:17px}.folder-main small{color:#6b7280}.folder-stats{display:flex;gap:10px;font-weight:800}.folder-arrow{font-size:28px;color:#9ca3af}.history-detail-head{display:flex;align-items:center;gap:14px;margin:12px 0}.history-detail-head h3{margin:0}.history-detail-head small{color:#6b7280}
@media (min-width:700px){.history-toolbar{grid-template-columns:1fr auto}.history-summary{grid-template-columns:repeat(4,1fr)}.history-group-head{padding:16px 18px}.balance-table th,.balance-table td,.event-table th,.event-table td{padding:10px 12px}}
@media (min-width:900px){
main{max-width:1400px;padding:24px 32px 40px}
#productList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
#productList>.tree{margin:0;background:#fff;border:1px solid #d7dce3;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0000000a}
#productList>.tree-parent{display:block}
.tree-parent{margin:0;border-radius:0;background:#f8fafc;border-bottom:1px solid #e5e7eb;padding:18px 20px}
.tree-head{align-items:flex-start}
.tree-head>div:first-child{min-width:0}
.tree-children{padding:10px 16px 16px 32px;background:#fff}
.tree-child{margin:8px 0;padding:0 0 0 16px;border-left:3px solid #dbe2ea}
.tree-child .card{margin:0;border:1px solid #e5e7eb;box-shadow:none;border-radius:12px}
.sub-actions{justify-content:flex-end}
.sub-actions button{flex:0 0 auto;min-width:150px}
.product{min-height:76px}
}
@media (min-width:1300px){#productList{grid-template-columns:repeat(3,minmax(0,1fr))}}


.qr-mini{font-size:12px;color:#5b1827}.qr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.qr-box{display:flex;justify-content:center;align-items:center;background:#fff;padding:14px;border-radius:14px;border:1px solid #e5e7eb;margin:12px auto;width:max-content}.qr-code-text{font-family:monospace;font-size:12px;word-break:break-all;color:#6b7280;text-align:center}.qr-print{min-width:120px}@media print{body *{visibility:hidden!important}.qr-print-area,.qr-print-area *{visibility:visible!important}.qr-print-area{position:absolute;left:0;top:0;width:100%;padding:30px;text-align:center}.qr-print-area .qr-box{margin:20px auto}.no-print{display:none!important}}

/* V13 KOTINÄKYMÄN PÄÄTUOTELISTA */
.home-parent-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.home-parent-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid #ded5ca;border-radius:14px;background:#fffdf8;color:#241d1a;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.home-parent-row:hover{border-color:#9b6a46;transform:translateY(-1px)}
.home-parent-icon{font-size:24px;flex:0 0 auto}
.home-parent-main{display:flex;flex-direction:column;min-width:0;flex:1}
.home-parent-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-parent-main small{margin-top:3px;color:#78685e}
.home-parent-qty{font-weight:700;color:#5b1827;white-space:nowrap}
.home-parent-qty.low{color:#9b2020}
.home-parent-arrow{font-size:26px;color:#8b776a;line-height:1}
@media(max-width:600px){.home-products .row{align-items:flex-start}.home-products .row>button{flex:0 0 auto}.home-parent-row{padding:11px 10px;gap:9px}.home-parent-icon{font-size:21px}.home-parent-main b{font-size:15px}.home-parent-main small{font-size:12px}.home-parent-qty{font-size:14px}.home-parent-arrow{font-size:23px}}
</style>
</head>
<body>
<header><h1>📦 Varasto QR Cloud</h1><p id="userLabel">Kirjaudu sisään käyttääksesi varastoa</p></header>
<main>
<button id="installBtn" class="primary full install">📲 Asenna sovellus puhelimeen</button>
<section id="loginView">
<div class="card"><h2>Kirjaudu</h2><div id="loginMsg"></div>
<label>Sähköposti</label><input id="email" type="email" autocomplete="email">
<label>Salasana</label><input id="password" type="password" autocomplete="current-password">
<button class="primary full" onclick="loginUser()">Kirjaudu</button>
<button class="secondary full" style="margin-top:8px" onclick="signup()">Luo käyttäjä</button></div>
</section>

<section id="app" class="hidden">
<div class="stats"><div class="card stat"><b id="productCount">0</b><span>Tuotteita</span></div><div class="card stat"><b id="parentCount">0</b><span>Päätuotteita</span></div></div>
<div class="card"><button class="primary full" onclick="openScanner()">📷 Skannaa QR-koodi</button>
<div class="actions" style="margin-top:10px"><button class="secondary" onclick="show('products')">📦 Tuotteet</button><button class="secondary" onclick="show('history')">🕘 Historia</button></div></div>
<div class="card"><h3 style="margin-top:0">Viimeisimmät tapahtumat</h3><div id="recent"></div></div>
<div class="card home-products"><div class="row"><div><h3 style="margin:0">📦 Varastotuotteet</h3><div class="unit">Päätuotteet</div></div><button class="secondary" onclick="show('products')">Kaikki tuotteet</button></div><div id="homeParentList" class="home-parent-list"></div></div>
</section>

<section id="products" class="hidden"><div class="card"><button class="primary full" onclick="openProductForm()">＋ Lisää päätuote</button><button class="secondary full" style="margin-top:8px" onclick="openSubProductForm()">＋ Lisää alatuote</button><input id="search" placeholder="Hae tuotetta..." oninput="renderProducts()"></div><div id="productList"></div></section>
<section id="history" class="hidden">
<div class="card">
  <h3 style="margin-top:0">Varastohistoria ja tuoteryhmät</h3>
  <div class="history-toolbar">
    <div><label>Kuukausi raportille</label><input id="reportMonth" type="month"></div>
    <button class="primary" onclick="showMonthlyReport()">📄 Näytä kuukausiraportti</button>
  </div>
  <div id="historySummary" class="history-summary"></div>
  <div id="historyList"></div>
</div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="sheet">
<div class="row"><h2 id="modalTitle" style="margin:0">Skannaa</h2><button class="secondary" onclick="closeModal()">Sulje</button></div>
<div id="scannerArea"><div class="notice">Salli kameran käyttö selaimelle. QR-kuvan voi myös valita tiedostona.</div><div id="reader"></div><input id="qrFile" type="file" accept="image/*"></div>
<div id="productArea" class="hidden"></div><div id="formArea" class="hidden"></div>
</div></div>
<div class="tabs hidden" id="tabs"><button onclick="show('app')">🏠<br>Koti</button><button onclick="openScanner()">📷<br>Skannaa</button><button onclick="show('products')">📦<br>Tuotteet</button><button onclick="show('history')">🕘<br>Historia</button></div>

<script>
const SUPABASE_URL="https://wjomczxgwfozwfjefzqe.supabase.co";
const SUPABASE_KEY="sb_publishable_vJtr76HkvvWYOwgpxGHDzg_xgVZz-XV";
const API=SUPABASE_URL;
const $=id=>document.getElementById(id);
const loginView=$("loginView"), appView=$("app"), tabsView=$("tabs");
const userLabelEl=$("userLabel"), loginMsgEl=$("loginMsg"), emailInput=$("email"), passwordInput=$("password");
const modalEl=$("modal"), modalTitleEl=$("modalTitle"), scannerAreaEl=$("scannerArea"), productAreaEl=$("productArea"), formAreaEl=$("formArea"), readerEl=$("reader");
const qrFileInput=$("qrFile"), productCountEl=$("productCount"), parentCountEl=$("parentCount"), recentEl=$("recent"), homeParentListEl=$("homeParentList"), productListEl=$("productList"), historyListEl=$("historyList"), historySummaryEl=$("historySummary"), reportMonthEl=$("reportMonth"), searchInput=$("search");
let products=[], history=[], scanner=null, session=null, scannerStarting=false, scannerClosing=false;
const expandedParents=new Set(JSON.parse(localStorage.getItem('varasto_qr_v7_expanded_parents')||'[]'));
function currentMonthValue(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
if(reportMonthEl)reportMonthEl.value=currentMonthValue();
function saveExpanded(){localStorage.setItem('varasto_qr_v7_expanded_parents',JSON.stringify([...expandedParents]))}
function toggleParent(id){expandedParents.has(id)?expandedParents.delete(id):expandedParents.add(id);saveExpanded();renderProducts()}
function configured(){return /^https:\/\//.test(SUPABASE_URL)&&/^sb_publishable_/.test(SUPABASE_KEY)}
function msg(t,error=false){loginMsgEl.innerHTML='<div class="notice '+(error?'error':'')+'">'+esc(t)+'</div>'}
function setLoginBusy(busy){loginView.querySelectorAll('button').forEach(b=>b.disabled=busy);const b=loginView.querySelector('.primary');if(b)b.textContent=busy?'Kirjaudutaan…':'Kirjaudu'}
function saveSession(s){session=s;if(s)localStorage.setItem('varasto_qr_session',JSON.stringify(s));else localStorage.removeItem('varasto_qr_session')}
function loadSession(){try{return JSON.parse(localStorage.getItem('varasto_qr_session')||'null')}catch{return null}}
async function authFetch(path,options={}){const r=await fetch(API+path,{...options,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||('HTTP '+r.status));return d}
async function dbFetch(path,options={}){if(!session?.access_token)throw new Error('Kirjautumisistunto puuttuu. Kirjaudu uudelleen.');return authFetch('/rest/v1'+path,{...options,headers:{Authorization:'Bearer '+session.access_token,Prefer:'return=representation',...(options.headers||{})}})}
async function loginUser(){if(!configured())return msg('Sovelluksen Supabase-asetukset ovat virheelliset.',true);const email=emailInput.value.trim(),password=passwordInput.value;if(!email||!password)return msg('Anna sähköpostiosoite ja salasana.',true);setLoginBusy(true);msg('Otetaan yhteyttä Supabaseen…');try{const d=await authFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d?.access_token)throw new Error('Supabase ei palauttanut kirjautumisistuntoa.');saveSession(d);await enterApp()}catch(e){console.error(e);msg('Kirjautuminen epäonnistui: '+(e?.message||e),true)}finally{setLoginBusy(false)}}
async function signup(){if(!configured())return msg('Sovelluksen Supabase-asetukset ovat virheelliset.',true);const email=emailInput.value.trim(),password=passwordInput.value;if(!email||!password)return msg('Anna sähköpostiosoite ja salasana.',true);if(password.length<6)return msg('Salasanassa pitää olla vähintään 6 merkkiä.',true);setLoginBusy(true);msg('Luodaan käyttäjää…');try{const d=await authFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(d?.access_token){saveSession(d);await enterApp()}else msg('Käyttäjä luotu. Jos sähköpostivahvistus on käytössä, vahvista sähköposti ja kirjaudu sitten.')}catch(e){console.error(e);msg('Käyttäjän luonti epäonnistui: '+(e?.message||e),true)}finally{setLoginBusy(false)}}
async function logout(){saveSession(null);loginView.classList.remove('hidden');appView.classList.add('hidden');tabsView.classList.add('hidden');userLabelEl.textContent='Kirjaudu sisään käyttääksesi varastoa';products=[];history=[]}
async function enterApp(){const u=session?.user;loginView.classList.add('hidden');appView.classList.remove('hidden');tabsView.classList.remove('hidden');userLabelEl.textContent=u?.email||'Kirjautunut';await loadAll()}
(async()=>{if(!configured()){msg('Supabase-asetukset ovat virheelliset.',true);return}const s=loadSession();if(s?.access_token){session=s;try{const u=await authFetch('/auth/v1/user',{headers:{Authorization:'Bearer '+s.access_token}});session.user=u;saveSession(session);await enterApp()}catch(e){console.warn('Vanha istunto ei kelpaa:',e);saveSession(null)}}})();
[emailInput,passwordInput].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')loginUser()}));
async function loadAll(){try{products=await dbFetch('/products?select=*&order=name.asc')||[];await ensureQrCodes();history=await dbFetch('/stock_movements?select=*&order=created_at.desc&limit=500')||[];renderAll()}catch(e){console.error(e);alert('Tietojen lataus epäonnistui: '+e.message)}}
async function ensureQrCodes(){for(const p of products){if(!p.qr_code&&p.id){const code='VQC:'+p.id;try{await dbFetch('/products?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({qr_code:code})});p.qr_code=code}catch(e){console.warn('QR-koodia ei voitu luoda tuotteelle',p.id,e)}}}}
function show(id){['app','products','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));renderAll()}
function fmtQty(v){const n=Number(v||0);return Number.isInteger(n)?String(n):n.toLocaleString('fi-FI',{maximumFractionDigits:3})}
function unitLabel(u){return u==='kg'?'kg':u==='l'?'l':'kpl'}
function renderAll(){productCountEl.textContent=products.length;parentCountEl.textContent=products.filter(p=>!p.parent_id).length;renderProducts();renderHistory();renderRecent();renderHomeParents()}
function renderHomeParents(){if(!homeParentListEl)return;const roots=products.filter(p=>!p.parent_id).sort((a,b)=>a.name.localeCompare(b.name,'fi'));if(!roots.length){homeParentListEl.innerHTML='<div class="empty">Ei päätuotteita vielä.</div>';return}homeParentListEl.innerHTML=roots.map(p=>{const kids=childrenOf(p.id);const low=Number(p.quantity)<=Number(p.min_quantity);return `<button class="home-parent-row" onclick="openProduct('${escAttr(p.id)}')"><span class="home-parent-icon">🍷</span><span class="home-parent-main"><b>${esc(p.name)}</b><small>${kids.length} alatuotetta · ${esc(p.location||'Ei sijaintia')}</small></span><span class="home-parent-qty ${low?'low':''}">${fmtQty(p.quantity)} ${unitLabel(p.unit)}</span><span class="home-parent-arrow">›</span></button>`}).join('')}
function childrenOf(id){return products.filter(p=>p.parent_id===id)}
function productCard(p,child=false){return `<div class="card product ${child?'indent':''}"><div><b>${esc(p.name)}</b><br><small>${esc(p.sku)} · ${p.unit} · QR ${esc(p.qr_code||'-')} · ${esc(p.location||'-')}</small></div><div class="qty ${Number(p.quantity)<=Number(p.min_quantity)?'low':''}">${fmtQty(p.quantity)} ${unitLabel(p.unit)}<br><button class="secondary" onclick="openProduct('${escAttr(p.id)}')">Avaa</button><button class="secondary" onclick="showQr('${escAttr(p.id)}')">📱 QR</button></div></div>`}
function renderProducts(){const q=(searchInput?.value||'').trim().toLowerCase();const roots=products.filter(p=>!p.parent_id);let html='';for(const parent of roots){const kids=childrenOf(parent.id);const matches=!q||[parent,...kids].some(p=>(p.name+' '+p.sku+' '+(p.qr_code||'')).toLowerCase().includes(q));if(!matches)continue;const open=(!q&&expandedParents.has(parent.id))||!!q;html+=`<div class="tree"><div class="tree-parent"><div class="tree-head"><div>📦 ${esc(parent.name)} <span class="pill">${unitLabel(parent.unit)}</span><div class="unit">${kids.length} alatuotetta · saldo ${fmtQty(parent.quantity)} ${unitLabel(parent.unit)}</div></div><button class="secondary" onclick="toggleParent('${escAttr(parent.id)}')">${open?'▲ Piilota':'▼ Näytä'}</button></div><div class="sub-actions"><button class="secondary" onclick="openProduct('${escAttr(parent.id)}')">Avaa päätuote</button><button class="primary" onclick="openSubProductForm('${escAttr(parent.id)}')">＋ Alatuote</button></div></div>${open?`<div class="tree-children">${kids.length?kids.map(k=>`<div class="tree-child"><div class="unit">Alatuote</div>${productCard(k,true)}</div>`).join(''):'<div class="card empty">Ei alatuotteita.</div>'}</div>`:''}</div>`}const orphan=products.filter(p=>p.parent_id&&!products.some(x=>x.id===p.parent_id));if(orphan.length)html+='<div class="card"><b>Ilman päätuotetta</b><div class="unit">Näitä tuotteita voi korjata avaamalla ja valitsemalla päätuotteen.</div></div>'+orphan.map(p=>productCard(p)).join('');productListEl.innerHTML=html||'<div class="card empty">Ei tuotteita.</div>'}
function rootProductFor(p){
  let cur=p, guard=0;
  while(cur?.parent_id&&guard<20){cur=products.find(x=>x.id===cur.parent_id);guard++}
  return cur||p;
}
function groupProducts(){
  const groups=new Map();
  for(const p of products){const root=rootProductFor(p);if(!groups.has(root.id))groups.set(root.id,{root,items:[]});groups.get(root.id).items.push(p)}
  return [...groups.values()].sort((a,b)=>a.root.name.localeCompare(b.root.name,'fi'));
}
function monthKey(date){const d=new Date(date);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabel(key){const [y,m]=key.split('-').map(Number);const t=new Intl.DateTimeFormat('fi-FI',{month:'long',year:'numeric'}).format(new Date(y,m-1,1));return t.charAt(0).toUpperCase()+t.slice(1)}
function monthFolders(){
  const map=new Map();
  history.forEach(h=>{const k=monthKey(h.created_at);if(!map.has(k))map.set(k,[]);map.get(k).push(h)});
  return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
}
function renderHistory(){
  const folders=monthFolders();
  const groups=groupProducts();
  const totalEvents=history.length, additions=history.filter(h=>Number(h.delta)>0).length, removals=history.filter(h=>Number(h.delta)<0).length;
  historySummaryEl.innerHTML=`<div class="card"><span>Tapahtumia</span><b>${totalEvents}</b></div><div class="card"><span>Lisäyksiä</span><b>${additions}</b></div><div class="card"><span>Vähennyksiä</span><b>${removals}</b></div><div class="card"><span>Kuukausia</span><b>${folders.length}</b></div>`;
  if(!folders.length){historyListEl.innerHTML='<div class="empty">Ei kirjattuja tapahtumia.</div>';return}
  historyListEl.innerHTML=`<div class="history-folders">${folders.map(([key,items])=>{
    const adds=items.filter(h=>Number(h.delta)>0).length, rems=items.filter(h=>Number(h.delta)<0).length;
    const productIds=new Set(items.map(h=>h.product_id));
    return `<button class="history-folder" onclick="openHistoryMonth('${key}')"><div class="folder-icon">📁</div><div class="folder-main"><strong>${esc(monthLabel(key))}</strong><small>${items.length} tapahtumaa · ${productIds.size} tuotetta</small></div><div class="folder-stats"><span class="event-plus">+${adds}</span><span class="event-minus">−${rems}</span></div><div class="folder-arrow">›</div></button>`;
  }).join('')}</div>`;
}
function openHistoryMonth(month){
  const items=history.filter(h=>monthKey(h.created_at)===month).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const groups=groupProducts();
  const byProduct=new Map(products.map(p=>[p.id,p]));
  const grouped=new Map();
  items.forEach(h=>{const p=byProduct.get(h.product_id);const root=rootProductFor(p||{name:h.product_name,parent_id:null});if(!grouped.has(root.id))grouped.set(root.id,{root,events:[]});grouped.get(root.id).events.push({...h,_product:p});});
  const title=monthLabel(month);
  historyListEl.innerHTML=`<div class="history-detail-head"><button class="secondary" onclick="renderHistory()">← Kaikki kuukaudet</button><div><h3>📁 ${esc(title)}</h3><small>${items.length} tapahtumaa</small></div></div>`+
    [...grouped.values()].sort((a,b)=>a.root.name.localeCompare(b.root.name,'fi')).map(g=>{
      const ev=g.events;
      return `<div class="history-group"><div class="history-group-head"><h4>📦 ${esc(g.root.name)}</h4><small>${ev.length} tapahtumaa · päätuotteen saldo nyt ${fmtQty(g.root.quantity)} ${unitLabel(g.root.unit)}</small></div><div style="padding:10px 12px 12px"><table class="event-table"><thead><tr><th>Aika</th><th>Tuote</th><th>Muutos</th><th>Saldo</th></tr></thead><tbody>${ev.map(h=>`<tr><td>${new Date(h.created_at).toLocaleString('fi-FI')}</td><td>${esc(h.product_name||h._product?.name||'Tuote')}</td><td class="${Number(h.delta)>0?'event-plus':'event-minus'}">${Number(h.delta)>0?'+':''}${fmtQty(h.delta)} ${unitLabel(h.unit||h._product?.unit||'kpl')}</td><td>${fmtQty(h.balance_after)} ${unitLabel(h.unit||h._product?.unit||'kpl')}</td></tr>`).join('')}</tbody></table></div></div>`;
    }).join('') || '<div class="empty">Ei tapahtumia tässä kuukaudessa.</div>';
}
async function fetchMonthlyHistory(month){
  const [y,m]=month.split('-').map(Number); if(!y||!m)throw new Error('Valitse kuukausi.');
  const start=new Date(y,m-1,1); const end=new Date(y,m,1);
  const q='/stock_movements?select=*&created_at=gte.'+encodeURIComponent(start.toISOString())+'&created_at=lt.'+encodeURIComponent(end.toISOString())+'&order=created_at.asc';
  return await dbFetch(q)||[];
}
function reportGroupData(monthHistory){
  const groups=groupProducts();
  const byRoot=new Map(groups.map(g=>[g.root.id,{...g,events:[]} ]));
  for(const h of monthHistory){const p=products.find(x=>x.id===h.product_id);const root=rootProductFor(p||{name:h.product_name,parent_id:null});if(!byRoot.has(root.id))byRoot.set(root.id,{root,items:p?[p]:[],events:[]});byRoot.get(root.id).events.push({...h,_product:p});}
  return [...byRoot.values()].sort((a,b)=>a.root.name.localeCompare(b.root.name,'fi'));
}
function showMonthlyReport(){
  const month=reportMonthEl?.value||currentMonthValue();
  showPrintReport(month);
}
async function showPrintReport(month){
  try{
    const monthHistory=await fetchMonthlyHistory(month); const groups=reportGroupData(monthHistory); const [y,m]=month.split('-').map(Number); const monthName=new Intl.DateTimeFormat('fi-FI',{month:'long',year:'numeric'}).format(new Date(y,m-1,1));
    const adds=monthHistory.filter(h=>Number(h.delta)>0).length, rems=monthHistory.filter(h=>Number(h.delta)<0).length;
    const rows=groups.map(g=>`<section class="group"><h2>📦 ${esc(g.root.name)}</h2><p class="muted">Tuoteryhmässä ${g.items.length} tuotetta</p><h3>Varastosaldot</h3><table><thead><tr><th>Tuote</th><th>Tyyppi</th><th>Sijainti</th><th>Saldo</th></tr></thead><tbody>${g.items.sort((a,b)=>a.parent_id?b.parent_id?a.name.localeCompare(b.name,'fi'):-1:1).map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.sku)}</small></td><td>${p.id===g.root.id?'Päätuote':'Alatuote'}</td><td>${esc(p.location||'-')}</td><td>${fmtQty(p.quantity)} ${unitLabel(p.unit)}</td></tr>`).join('')}</tbody></table><h3>Tapahtumat kuukaudelta</h3>${g.events.length?`<table><thead><tr><th>Aika</th><th>Tuote</th><th>Muutos</th><th>Saldo tapahtuman jälkeen</th></tr></thead><tbody>${g.events.map(h=>`<tr><td>${new Date(h.created_at).toLocaleString('fi-FI')}</td><td>${esc(h.product_name||h._product?.name||'Tuote')}</td><td>${Number(h.delta)>0?'+':''}${fmtQty(h.delta)} ${unitLabel(h.unit||h._product?.unit||'kpl')}</td><td>${fmtQty(h.balance_after)} ${unitLabel(h.unit||h._product?.unit||'kpl')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Ei tapahtumia.</p>'}</section>`).join('');
    const w=window.open('','_blank'); if(!w){alert('Tulostusikkuna estettiin selaimessa. Salli ponnahdusikkunat tälle sivulle.');return;}
    w.document.write(`<!doctype html><html lang="fi"><head><meta charset="utf-8"><title>Varasto QR - Kuukausiraportti ${esc(monthName)}</title><style>@page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;color:#111;font-size:12px;margin:0}h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 4px}h3{font-size:13px;margin:14px 0 6px}.meta{color:#555;margin-bottom:18px}.group{page-break-inside:avoid;border-top:2px solid #111;padding-top:10px;margin-top:18px}.muted{color:#666}table{width:100%;border-collapse:collapse;margin-bottom:8px}th,td{border:1px solid #ccc;padding:6px 7px;text-align:left;vertical-align:top}th{background:#f1f1f1;font-size:11px}td:last-child,th:last-child{text-align:right}.totals{display:flex;gap:30px;margin:12px 0 18px;font-weight:bold}.footer{margin-top:20px;color:#666;font-size:10px}@media print{.no-print{display:none}}</style></head><body><h1>Varasto QR Cloud – kuukausiraportti</h1><div class="meta">${esc(monthName.charAt(0).toUpperCase()+monthName.slice(1))} · Tulostettu ${new Date().toLocaleString('fi-FI')}</div><div class="totals"><span>Tapahtumia: ${monthHistory.length}</span><span>Lisäyksiä: ${adds}</span><span>Vähennyksiä: ${rems}</span><span>Tuoteryhmiä: ${groups.length}</span></div>${rows||'<p>Ei tuoteryhmiä.</p>'}<div class="footer">Varasto QR Cloud</div><script>window.onload=function(){setTimeout(function(){window.print()},300)};<\/script></body></html>`); w.document.close();
  }catch(e){alert('Kuukausiraportin muodostus epäonnistui: '+e.message)}
}
function renderRecent(){recentEl.innerHTML=history.slice(0,5).map(h=>`<div style="padding:8px 0;border-bottom:1px solid #eee">${Number(h.delta)>0?'➕':'➖'} <b>${fmtQty(Math.abs(h.delta))} ${unitLabel(h.unit||'kpl')}</b> ${esc(h.product_name||'Tuote')} <small>· saldo ${fmtQty(h.balance_after)} ${unitLabel(h.unit||'kpl')}</small></div>`).join('')||'<div class="empty">Ei tapahtumia vielä.</div>'}
function openModal(t){modalEl.classList.remove('hidden');modalTitleEl.textContent=t}
async function closeModal(){scannerClosing=true;await stopScanner();modalEl.classList.add('hidden');scannerClosing=false}
async function openScanner(){await stopScanner();openModal('Skannaa QR-koodi');scannerAreaEl.classList.remove('hidden');productAreaEl.classList.add('hidden');formAreaEl.classList.add('hidden');readerEl.innerHTML='';scannerClosing=false;setTimeout(()=>startScanner(),150)}
async function startScanner(){if(scannerClosing||scannerStarting||scanner)return;if(typeof Html5Qrcode==='undefined'){readerEl.innerHTML='<div class="notice error">QR-skannerin kirjasto ei latautunut. Voit silti lisätä tuotteen Tuotteet-näkymästä.</div>';return}scannerStarting=true;try{const instance=new Html5Qrcode('reader');scanner=instance;await instance.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async code=>{if(scannerClosing)return;scannerClosing=true;await stopScanner();scannerClosing=false;handleCode(code)},()=>{})}catch(e){if(!scannerClosing)readerEl.innerHTML='<div class="notice error">Kameraa ei voitu avata. Salli kamera tai käytä QR-kuvaa.</div>';scanner=null}finally{scannerStarting=false;if(scannerClosing)await stopScanner()}}
async function stopScanner(){const current=scanner;scanner=null;if(!current){if(readerEl)readerEl.innerHTML='';return}try{await current.stop()}catch(e){}try{await current.clear()}catch(e){}if(readerEl)readerEl.innerHTML=''}
qrFileInput.addEventListener('change',async e=>{if(!e.target.files[0]||typeof Html5Qrcode==='undefined')return;const r=new Html5Qrcode('reader');try{const c=await r.scanFile(e.target.files[0],true);try{await r.clear()}catch(_){}handleCode(c)}catch(_){alert('QR-koodia ei löytynyt kuvasta.');try{await r.clear()}catch(e){}}})
async function handleCode(code){try{const d=await dbFetch('/products?select=*&qr_code=eq.'+encodeURIComponent(code));d?.[0]?openProduct(d[0].id):openNewFromQr(code)}catch(e){alert('QR-tuotteen haku epäonnistui: '+e.message)}}
async function openProduct(id){try{const d=await dbFetch('/products?select=*&id=eq.'+encodeURIComponent(id));const p=d?.[0];if(!p)throw new Error('Tuotetta ei löytynyt.');openModal(p.name);scannerAreaEl.classList.add('hidden');formAreaEl.classList.add('hidden');productAreaEl.classList.remove('hidden');const parent=p.parent_id?products.find(x=>x.id===p.parent_id):null;productAreaEl.innerHTML=`<div class="card"><span class="pill">${p.parent_id?'Alatuote':'Päätuote'} · ${p.unit}</span><h2>${esc(p.name)}</h2>${parent?`<p>📦 Päätuote: <b>${esc(parent.name)}</b></p>`:''}<div class="qty" style="font-size:42px;text-align:left">${fmtQty(p.quantity)} ${unitLabel(p.unit)}</div><p>Paikka: ${esc(p.location||'-')}<br>Minimiraja: ${fmtQty(p.min_quantity)} ${unitLabel(p.unit)}</p><div class="actions"><button class="secondary" onclick="changeQty('${p.id}',-1)">➖ Ota pois</button><button class="primary" onclick="changeQty('${p.id}',1)">➕ Lisää</button></div><button class="secondary full" style="margin-top:10px" onclick="showQr('${p.id}')">📱 Näytä QR-koodi</button><button class="secondary full" style="margin-top:10px" onclick="editProduct('${p.id}')">Muokkaa</button><button class="danger full" style="margin-top:10px" onclick="deleteProduct('${p.id}')">🗑 Poista tuote</button></div>`}catch(e){alert(e.message)}}
async function changeQty(id,sign){const p=products.find(x=>x.id===id);if(!p)return;const n=prompt((sign>0?'Lisättävä ':'Poistettava ')+'määrä ('+unitLabel(p.unit)+'):','1');const amount=Number(String(n).replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return;const decimals=p.unit==='kpl'?0:3;if(p.unit==='kpl'&&!Number.isInteger(amount))return alert('Kappalemäärän pitää olla kokonaisluku.');const rounded=Number(amount.toFixed(decimals));try{await dbFetch('/rpc/change_stock',{method:'POST',body:JSON.stringify({p_product_id:id,p_delta:sign*rounded})});await loadAll();openProduct(id)}catch(e){alert('Varastomuutosta ei voitu tallentaa: '+e.message)}}
function parentOptions(selected='',excludeId=''){return '<option value="">— Ei päätuotetta (päätuote) —</option>'+products.filter(p=>!p.parent_id&&p.id!==excludeId).map(p=>`<option value="${escAttr(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}
function productForm(p,forceChild=false){const isChild=forceChild||!!p?.parent_id;return `<div class="card"><label>Tyyppi</label><select id="f_parent" ${forceChild?'required':''} style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 11px">${parentOptions(p?.parent_id||'',p?.id||'')}</select><label>Nimi</label><input id="f_name" value="${escAttr(p?.name||'')}"><label>Tuotenumero</label><input id="f_sku" value="${escAttr(p?.sku||'')}"><label>Yksikkö</label><select id="f_unit" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 11px"><option value="kpl" ${(p?.unit||'kpl')==='kpl'?'selected':''}>kpl</option><option value="kg" ${p?.unit==='kg'?'selected':''}>kg</option><option value="l" ${p?.unit==='l'?'selected':''}>litraa (l)</option></select><label>QR-koodi</label><input id="f_qr" value="${escAttr(p?.qr_code||'')}" placeholder="Luodaan automaattisesti tallennettaessa"><label>Nykyinen määrä</label><input id="f_qty" type="number" min="0" step="0.001" value="${p?.quantity??0}"><label>Minimiraja</label><input id="f_min" type="number" min="0" step="0.001" value="${p?.min_quantity??0}"><label>Varastopaikka</label><input id="f_loc" value="${escAttr(p?.location||'')}"><button class="primary full" onclick="saveProduct('${p?.id||''}')">Tallenna</button>${p?.id?`<button class="danger full" style="margin-top:10px" onclick="deleteProduct('${p.id}')">🗑 Poista tuote</button>`:''}</div>`}
function openProductForm(){openModal('Lisää päätuote');scannerAreaEl.classList.add('hidden');productAreaEl.classList.add('hidden');formAreaEl.classList.remove('hidden');formAreaEl.innerHTML=productForm(null,false)}
function openSubProductForm(parentId=''){openModal('Lisää alatuote');scannerAreaEl.classList.add('hidden');productAreaEl.classList.add('hidden');formAreaEl.classList.remove('hidden');formAreaEl.innerHTML=productForm(parentId?{parent_id:parentId}:null,true);if(parentId)$("f_parent").value=parentId}
function openNewFromQr(code){openModal('Uusi tuote');scannerAreaEl.classList.add('hidden');productAreaEl.classList.add('hidden');formAreaEl.classList.remove('hidden');formAreaEl.innerHTML=productForm({qr_code:code},false)}
function editProduct(id){const p=products.find(x=>x.id===id);productAreaEl.classList.add('hidden');formAreaEl.classList.remove('hidden');formAreaEl.innerHTML=productForm(p,false)}
async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const kids=childrenOf(id);if(kids.length)return alert('Päätuotetta ei voi poistaa, koska sillä on alatuotteita. Poista ensin alatuotteet.');const ok=confirm('Poistetaanko tuote\n\n'+p.name+'\n\nTuote ja siihen liittyvä tapahtumahistoria poistetaan pysyvästi. Tätä ei voi perua.');if(!ok)return;try{await dbFetch('/products?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadAll();closeModal();show('products')}catch(e){alert('Tuotteen poistaminen epäonnistui: '+e.message)}}
async function saveProduct(id){const qtyRaw=Number(String($("f_qty").value).replace(',','.')),minRaw=Number(String($("f_min").value).replace(',','.')),unit=$("f_unit").value;if(!Number.isFinite(qtyRaw)||qtyRaw<0||!Number.isFinite(minRaw)||minRaw<0)return alert('Määrän pitää olla vähintään 0.');if(unit==='kpl'&&(!Number.isInteger(qtyRaw)||!Number.isInteger(minRaw)))return alert('Kappalemäärän pitää olla kokonaisluku.');const parentId=$("f_parent").value||null;if(id&&parentId===id)return alert('Tuote ei voi olla oman itsensä päätuote.');if(!id&&$("f_parent").required&&!parentId)return alert('Valitse alatuotteelle päätuote.');const newId=id||crypto.randomUUID();const enteredQr=$("f_qr").value.trim();const qrCode=enteredQr||('VQC:'+newId);const obj={id:newId,name:$("f_name").value.trim(),sku:$("f_sku").value.trim(),unit,qr_code:qrCode,quantity:unit==='kpl'?Math.round(qtyRaw):Number(qtyRaw.toFixed(3)),min_quantity:unit==='kpl'?Math.round(minRaw):Number(minRaw.toFixed(3)),location:$("f_loc").value.trim()||null,parent_id:parentId};if(!obj.name||!obj.sku)return alert('Nimi ja tuotenumero ovat pakollisia.');try{if(id)await dbFetch('/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(obj)});else await dbFetch('/products',{method:'POST',body:JSON.stringify(obj)});await loadAll();closeModal();show('products')}catch(e){alert('Tuotteen tallennus epäonnistui: '+e.message)}}
function showQr(id){const p=products.find(x=>x.id===id);if(!p)return alert('Tuotetta ei löytynyt.');if(!p.qr_code){p.qr_code='VQC:'+p.id;dbFetch('/products?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({qr_code:p.qr_code})}).catch(console.warn)}openModal('QR-koodi – '+p.name);scannerAreaEl.classList.add('hidden');formAreaEl.classList.add('hidden');productAreaEl.classList.remove('hidden');productAreaEl.innerHTML=`<div class="card qr-print-area"><h2>${esc(p.name)}</h2><div class="qr-box" id="qrDisplay"></div><div class="qr-code-text">${esc(p.qr_code)}</div><p>${esc(p.sku)} · ${unitLabel(p.unit)} · ${fmtQty(p.quantity)} ${unitLabel(p.unit)}</p><div class="qr-actions no-print"><button class="primary qr-print" onclick="printQr('${escAttr(p.id)}')">🖨 Tulosta QR</button><button class="secondary qr-print" onclick="closeModal()">Sulje</button></div></div>`;setTimeout(()=>{const el=document.getElementById('qrDisplay');if(el&&window.QRCode)new QRCode(el,{text:p.qr_code,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})},50)}
function printQr(id){showQr(id);setTimeout(()=>window.print(),350)}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return esc(s).replace(/`/g,'&#96;')}

<script>
let deferredInstallPrompt=null;
function isIosDevice(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(/Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>1)}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function setupInstallButton(){const b=document.getElementById('installBtn');if(!b)return;if(isStandalone()){b.classList.remove('show');return}if(isIosDevice()){b.classList.add('show');b.textContent='📲 Lisää sovellus aloitusnäyttöön';b.onclick=()=>alert('iPhonessa: paina Safarin alareunan Jaa-painiketta (neliö ja nuoli ylöspäin), valitse “Lisää Koti-valikkoon” ja vahvista. Jos käytät Chromea, avaa sivu ensin Safarissa.')} }
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('installBtn')?.classList.add('show')});
document.getElementById('installBtn')?.addEventListener('click',async()=>{if(isIosDevice())return;if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installBtn')?.classList.remove('show')});
window.addEventListener('appinstalled',()=>document.getElementById('installBtn')?.classList.remove('show'));
setupInstallButton();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
