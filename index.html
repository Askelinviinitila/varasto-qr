<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Varasto QR Cloud</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:23px}header p{margin:3px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:850px;margin:auto;padding:15px 15px 90px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat b{font-size:29px;display:block}.stat span{font-size:13px;color:#6b7280}
button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 11px}label{font-size:13px;font-weight:700;color:#374151}
.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin:10px 0}.error{background:#fee2e2;color:#991b1b}.product{display:flex;justify-content:space-between;gap:10px;align-items:center}.product small{color:#6b7280}.qty{font-size:20px;font-weight:800;text-align:right}.low{color:#b45309}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:end;z-index:20}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}.tabs button{flex:1;background:#fff;border-radius:0;font-size:12px;padding:13px 5px}.empty{text-align:center;color:#6b7280;padding:25px}
#reader{width:100%;border-radius:14px;overflow:hidden}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-size:12px}
</style>
</head>
<body>
<header><h1>📦 Varasto QR Cloud</h1><p id="userLabel">Kirjaudu sisään käyttääksesi varastoa</p></header>
<main>
<section id="login">
<div class="card"><h2>Kirjaudu</h2><div id="loginMsg"></div>
<label>Sähköposti</label><input id="email" type="email" autocomplete="email">
<label>Salasana</label><input id="password" type="password" autocomplete="current-password">
<button class="primary full" onclick="login()">Kirjaudu</button>
<button class="secondary full" style="margin-top:8px" onclick="signup()">Luo käyttäjä</button></div>
</section>

<section id="app" class="hidden">
<div class="stats"><div class="card stat"><b id="productCount">0</b><span>Tuotteita</span></div><div class="card stat"><b id="totalQty">0</b><span>Kappaleita</span></div></div>
<div class="card"><button class="primary full" onclick="openScanner()">📷 Skannaa QR-koodi</button>
<div class="actions" style="margin-top:10px"><button class="secondary" onclick="show('products')">📦 Tuotteet</button><button class="secondary" onclick="show('history')">🕘 Historia</button></div></div>
<div class="card"><h3 style="margin-top:0">Viimeisimmät tapahtumat</h3><div id="recent"></div></div>
</section>

<section id="products" class="hidden"><div class="card"><button class="primary full" onclick="openProductForm()">＋ Lisää tuote</button><input id="search" placeholder="Hae tuotetta..." oninput="renderProducts()"></div><div id="productList"></div></section>
<section id="history" class="hidden"><div class="card"><h3 style="margin-top:0">Varastohistoria</h3><div id="historyList"></div></div></section>
</main>

<div id="modal" class="modal hidden"><div class="sheet">
<div class="row"><h2 id="modalTitle" style="margin:0">Skannaa</h2><button class="secondary" onclick="closeModal()">Sulje</button></div>
<div id="scannerArea"><div class="notice">Salli kameran käyttö selaimelle. QR-kuvan voi myös valita tiedostona.</div><div id="reader"></div><input id="qrFile" type="file" accept="image/*"></div>
<div id="productArea" class="hidden"></div><div id="formArea" class="hidden"></div>
</div></div>
<div class="tabs hidden" id="tabs"><button onclick="show('app')">🏠<br>Koti</button><button onclick="openScanner()">📷<br>Skannaa</button><button onclick="show('products')">📦<br>Tuotteet</button><button onclick="show('history')">🕘<br>Historia</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script>
const SUPABASE_URL="https://wjomczxgwfozwfjefzqe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_vJtr76HkvvWYOwgpxGHDzg_xgVZz-XV";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let products=[], history=[], scanner=null;

function configured(){return !SUPABASE_URL.startsWith("YOUR_")&&!SUPABASE_ANON_KEY.startsWith("YOUR_")}
function msg(t,error=false){document.getElementById('loginMsg').innerHTML='<div class="notice '+(error?'error':'')+'">'+esc(t)+'</div>'}
async function login(){if(!configured())return msg('Aseta ensin SUPABASE_URL ja SUPABASE_ANON_KEY index.html-tiedostoon.',true);const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg(error.message,true)}
async function signup(){if(!configured())return msg('Aseta ensin Supabase-asetukset.',true);const {error}=await sb.auth.signUp({email:email.value.trim(),password:password.value});if(error)msg(error.message,true);else msg('Käyttäjä luotu. Tarkista sähköposti, jos vahvistus on käytössä.')}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange((_e,session)=>{if(session){login.style.display='none';app.classList.remove('hidden');tabs.classList.remove('hidden');userLabel.textContent=session.user.email;loadAll()}else{login.style.display='block';app.classList.add('hidden');tabs.classList.add('hidden');userLabel.textContent='Kirjaudu sisään käyttääksesi varastoa'}});

async function loadAll(){const p=await sb.from('products').select('*').order('name');if(p.error)return alert(p.error.message);products=p.data||[];const h=await sb.from('stock_movements').select('*').order('created_at',{ascending:false}).limit(100);if(h.error)return alert(h.error.message);history=h.data||[];renderAll()}
function show(id){['app','products','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));renderAll()}
function renderAll(){productCount.textContent=products.length;totalQty.textContent=products.reduce((s,p)=>s+p.quantity,0);renderProducts();renderHistory();renderRecent()}
function renderProducts(){const q=(search?.value||'').toLowerCase();const list=products.filter(p=>(p.name+' '+p.sku+' '+(p.qr_code||'')).toLowerCase().includes(q));productList.innerHTML=list.length?list.map(p=>`<div class="card product"><div><b>${esc(p.name)}</b><br><small>${esc(p.sku)} · QR ${esc(p.qr_code||'-')} · ${esc(p.location||'-')}</small></div><div class="qty ${p.quantity<=p.min_quantity?'low':''}">${p.quantity} kpl<br><button class="secondary" onclick="openProduct('${escAttr(p.id)}')">Avaa</button></div></div>`).join(''):'<div class="card empty">Ei tuotteita.</div>'}
function renderHistory(){historyList.innerHTML=history.length?history.map(h=>`<div style="padding:9px 0;border-bottom:1px solid #eee"><b>${h.delta>0?'+':''}${h.delta} kpl</b> · ${esc(h.product_name||'Tuote')}<br><small>${new Date(h.created_at).toLocaleString('fi-FI')} · saldo ${h.balance_after}</small></div>`).join(''):'<div class="empty">Ei tapahtumia.</div>'}
function renderRecent(){recent.innerHTML=history.slice(0,5).map(h=>`<div style="padding:8px 0;border-bottom:1px solid #eee">${h.delta>0?'➕':'➖'} <b>${Math.abs(h.delta)} kpl</b> ${esc(h.product_name||'Tuote')} <small>· saldo ${h.balance_after}</small></div>`).join('')||'<div class="empty">Ei tapahtumia vielä.</div>'}

function openModal(t){modal.classList.remove('hidden');modalTitle.textContent=t}
function closeModal(){stopScanner();modal.classList.add('hidden')}
async function openScanner(){openModal('Skannaa QR-koodi');scannerArea.classList.remove('hidden');productArea.classList.add('hidden');formArea.classList.add('hidden');setTimeout(startScanner,150)}
async function startScanner(){if(typeof Html5Qrcode==='undefined')return;scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},code=>{stopScanner();handleCode(code)},()=>{})}catch(e){reader.innerHTML='<div class="notice error">Kameraa ei voitu avata. Käytä HTTPS-yhteyttä ja salli kamera.</div>'}}
function stopScanner(){if(scanner){scanner.stop().catch(()=>{});scanner.clear().catch(()=>{});scanner=null}}
qrFile.addEventListener('change',async e=>{if(!e.target.files[0])return;const r=new Html5Qrcode("reader");try{const c=await r.scanFile(e.target.files[0],true);handleCode(c)}catch(_){alert('QR-koodia ei löytynyt kuvasta.')}r.clear().catch(()=>{})})
async function handleCode(code){const {data,error}=await sb.from('products').select('*').eq('qr_code',code).maybeSingle();if(error)return alert(error.message);data?openProduct(data.id):openNewFromQr(code)}
async function openProduct(id){const {data:p,error}=await sb.from('products').select('*').eq('id',id).single();if(error)return alert(error.message);openModal(p.name);scannerArea.classList.add('hidden');formArea.classList.add('hidden');productArea.classList.remove('hidden');productArea.innerHTML=`<div class="card"><span class="pill">QR ${esc(p.qr_code||'-')}</span><h2>${esc(p.name)}</h2><div class="qty" style="font-size:42px;text-align:left">${p.quantity} kpl</div><p>Paikka: ${esc(p.location||'-')}<br>Minimiraja: ${p.min_quantity} kpl</p><div class="actions"><button class="secondary" onclick="changeQty('${p.id}',-1)">➖ Ota pois</button><button class="primary" onclick="changeQty('${p.id}',1)">➕ Lisää</button></div><button class="secondary full" style="margin-top:10px" onclick="editProduct('${p.id}')">Muokkaa</button></div>`}
async function changeQty(id,sign){const n=prompt(sign>0?'Lisättävä määrä:':'Poistettava määrä:','1');const amount=parseInt(n,10);if(!Number.isInteger(amount)||amount<=0)return;const {data,error}=await sb.rpc('change_stock',{p_product_id:id,p_delta:sign*amount});if(error)return alert(error.message);await loadAll();openProduct(id)}
function productForm(p){return `<div class="card"><label>Nimi</label><input id="f_name" value="${escAttr(p?.name||'')}"><label>Tuotenumero</label><input id="f_sku" value="${escAttr(p?.sku||'')}"><label>QR-koodi</label><input id="f_qr" value="${escAttr(p?.qr_code||'')}"><label>Määrä</label><input id="f_qty" type="number" min="0" value="${p?.quantity??0}"><label>Minimiraja</label><input id="f_min" type="number" min="0" value="${p?.min_quantity??0}"><label>Varastopaikka</label><input id="f_loc" value="${escAttr(p?.location||'')}"><button class="primary full" onclick="saveProduct('${p?.id||''}')">Tallenna</button></div>`}
function openProductForm(){openModal('Lisää tuote');scannerArea.classList.add('hidden');productArea.classList.add('hidden');formArea.classList.remove('hidden');formArea.innerHTML=productForm(null)}
async function openNewFromQr(code){openModal('Uusi tuote');scannerArea.classList.add('hidden');productArea.classList.add('hidden');formArea.classList.remove('hidden');formArea.innerHTML=productForm({qr_code:code})}
async function editProduct(id){const p=products.find(x=>x.id===id);productArea.classList.add('hidden');formArea.classList.remove('hidden');formArea.innerHTML=productForm(p)}
async function saveProduct(id){const obj={name:f_name.value.trim(),sku:f_sku.value.trim(),qr_code:f_qr.value.trim()||null,quantity:Math.max(0,parseInt(f_qty.value)||0),min_quantity:Math.max(0,parseInt(f_min.value)||0),location:f_loc.value.trim()||null};if(!obj.name||!obj.sku)return alert('Nimi ja tuotenumero ovat pakollisia.');let q=id?sb.from('products').update(obj).eq('id',id):sb.from('products').insert(obj);const {error}=await q;if(error)return alert(error.message);await loadAll();closeModal();show('products')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
</script>
</body></html>
